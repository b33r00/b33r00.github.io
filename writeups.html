<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>b3r0 — writeups</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0a;
  --panel:#0e0e0e;
  --fg:#f2f2f2;
  --muted:#b7b7b7;
  --muted2:#8d8d8d;
  --line:#1a1a1a;
  --accent:#f5c542;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,system-ui;
}

a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}

.layout{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  background:var(--panel);
  border-right:2px solid var(--accent);
  padding:26px 18px;
}

.brand{
  font-size:18px;
  font-weight:600;
  margin-bottom:18px;
}

.group{
  margin-bottom:18px;
}

.group-head{
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  font-size:14px;
  padding:6px 0;
}

.group-head:hover{color:var(--accent)}

.group ul{
  list-style:none;
  padding-left:12px;
  margin:8px 0 0 0;
  display:none;
}

.group.open ul{display:block}

.group li{
  padding:5px 0;
  font-size:13px;
  color:var(--muted);
  cursor:pointer;
}

.group li.active,
.group li:hover{
  color:var(--accent);
}

/* MAIN */
.main{
  padding:36px 40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

.title{
  font-size:22px;
  font-weight:600;
}

.search{
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg);
  padding:10px 12px;
  border-radius:10px;
  min-width:240px;
}

.filters{
  margin-top:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.tag{
  border:1px solid var(--line);
  padding:6px 10px;
  border-radius:999px;
  font-family:JetBrains Mono;
  font-size:12px;
  color:var(--muted2);
  cursor:pointer;
}

.tag.active,
.tag:hover{
  color:var(--accent);
  border-color:rgba(245,197,66,.4);
}

.list{
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.item{
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.item h3{
  margin:0;
  font-size:16px;
}

.item p{
  margin:6px 0;
  color:var(--muted);
  max-width:80ch;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  font-family:JetBrains Mono;
  font-size:12px;
  border:1px solid var(--line);
  padding:5px 8px;
  border-radius:999px;
  color:var(--muted2);
}

.badge.main{
  color:var(--accent);
  border-color:rgba(245,197,66,.4);
}

.empty{
  color:var(--muted);
}
</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

  <div class="brand">Explorer</div>

  <div class="group open" data-group="writeups">
    <div class="group-head">Writeups ▾</div>
    <ul>
      <li data-filter="all" class="active">All</li>
      <li data-filter="htb">HTB</li>
      <li data-filter="thm">THM</li>
      <li data-filter="other">Other</li>
    </ul>
  </div>

  <div class="group" data-group="notes">
    <div class="group-head">Notes ▾</div>
    <ul>
      <li>Linux</li>
      <li>Windows</li>
      <li>Web</li>
      <li>Active Directory</li>
      <li>Privilege Escalation</li>
    </ul>
  </div>

  <div class="group" data-group="homelabs">
    <div class="group-head">Homelabs ▾</div>
    <ul>
      <li>AD Lab Build</li>
      <li>Segmented Network</li>
      <li>Central Logging</li>
      <li>Vulnerable Web App</li>
      <li>Backup Drills</li>
    </ul>
  </div>

  <div class="group">
    <div class="group-head">Roadmap</div>
  </div>

</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <div class="title">Writeups</div>
    <input class="search" id="search" placeholder="Search writeups...">
  </div>

  <div class="filters" id="tags"></div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" style="display:none;">
    No matching writeups.
  </div>

</main>

</div>

<script>
const WRITEUPS = [
 {
  title:"CodePartTwo",
  platform:"htb",
  summary:"Web exploitation chain leading to privilege escalation.",
  tags:["web","rce","misconfiguration","privesc"],
  link:"/writeups/codeparttwo"
 },
 {
  title:"Expressway",
  platform:"htb",
  summary:"Network discovery, IKE weakness abuse and trust escalation.",
  tags:["network","ipsec","infoleak","privesc"],
  link:"/writeups/expressway"
 }
];

let currentFilter="all";
let currentTag=null;
let query="";

const list=document.getElementById("list");
const empty=document.getElementById("empty");
const search=document.getElementById("search");
const tagBox=document.getElementById("tags");

/* Sidebar toggle */
document.querySelectorAll(".group-head").forEach(h=>{
 h.onclick=()=>h.parentElement.classList.toggle("open");
});

/* Platform filter */
document.querySelectorAll("[data-filter]").forEach(btn=>{
 btn.onclick=()=>{
   document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
   btn.classList.add("active");
   currentFilter=btn.dataset.filter;
   render();
 };
});

/* Build tag filter list */
function buildTags(){
 const set=new Set();
 WRITEUPS.forEach(w=>w.tags.forEach(t=>set.add(t)));
 tagBox.innerHTML="";
 set.forEach(t=>{
  const el=document.createElement("div");
  el.className="tag";
  el.textContent="#"+t;
  el.onclick=()=>{
    currentTag=(currentTag===t?null:t);
    document.querySelectorAll(".tag").forEach(x=>x.classList.remove("active"));
    if(currentTag) el.classList.add("active");
    render();
  };
  tagBox.appendChild(el);
 });
}

search.oninput=()=>{query=search.value.toLowerCase();render();}

function render(){
 list.innerHTML="";
 const res=WRITEUPS.filter(w=>{
  if(currentFilter!=="all" && w.platform!==currentFilter) return false;
  if(currentTag && !w.tags.includes(currentTag)) return false;
  if(query && !(
     w.title.toLowerCase().includes(query) ||
     w.summary.toLowerCase().includes(query) ||
     w.tags.join(" ").includes(query)
  )) return false;
  return true;
 });

 empty.style.display=res.length?"none":"block";

 res.forEach(w=>{
  const d=document.createElement("div");
  d.className="item";
  d.innerHTML=`
    <h3><a href="${w.link}">${w.title}</a></h3>
    <p>${w.summary}</p>
    <div class="badges">
      <span class="badge main">${w.platform.toUpperCase()}</span>
      ${w.tags.map(t=>`<span class="badge">#${t}</span>`).join("")}
    </div>
  `;
  list.appendChild(d);
 });
}

buildTags();
render();
</script>

</body>
</html>
