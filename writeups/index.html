  <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>b3r0 — writeups</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0a0a0a;
      --fg:#f2f2f2;
      --muted:#b7b7b7;
      --muted2:#8d8d8d;
      --line:#1a1a1a;
      --accent:#f5c542;
      --max:1120px;
      --menuW:300px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.55;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ color:var(--accent); }

    .page{
      max-width:var(--max);
      margin:0 auto;
      padding:34px 18px 44px;
      display:grid;
      grid-template-columns: 1fr var(--menuW);
      gap:34px;
    }

    /* back arrow (top-left) */
    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-family:"JetBrains Mono", ui-monospace, monospace;
      color:var(--muted2);
      font-size:13px;
      margin-bottom:16px;
    }
    .back .arrow{
      width:34px;height:34px;
      border:1px solid var(--line);
      border-radius:10px;
      display:grid;
      place-items:center;
      color:var(--muted2);
    }
    .back:hover .arrow{
      border-color:rgba(245,197,66,0.35);
      color:var(--accent);
    }
    .back:hover{ color:var(--accent); }

    /* main content */
    .title{
      margin:0;
      font-size:22px;
      font-weight:600;
      letter-spacing:-0.01em;
    }
    .subtitle{
      margin:8px 0 0 0;
      color:var(--muted2);
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:13px;
    }

    .toolbar{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .search{
      flex:1 1 320px;
      max-width:520px;
    }
    .search input{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid var(--line);
      background:transparent;
      color:var(--fg);
      font-size:14px;
      outline:none;
    }
    .search input:focus{
      border-color:rgba(245,197,66,0.45);
    }
    .pill{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:999px;
      color:var(--muted2);
      background:transparent;
    }
    .pill strong{ color:var(--fg); font-weight:500; }

    .tagsRow{
      margin-top:14px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tag{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
      color:var(--muted2);
      cursor:pointer;
      user-select:none;
    }
    .tag:hover, .tag.active{
      color:var(--accent);
      border-color:rgba(245,197,66,0.35);
    }

    .list{
      margin-top:18px;
      border-top:1px solid var(--line);
      padding-top:18px;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .item{
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
    }
    .item:last-child{ border-bottom:none; padding-bottom:0; }

    .itemTitle{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:baseline;
      flex-wrap:wrap;
    }
    .itemTitle a{
      font-size:16px;
      font-weight:600;
      color:var(--fg);
    }
    .itemTitle a:hover{ color:var(--accent); }

    .badge{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
      color:var(--muted2);
      border:1px solid var(--line);
      padding:6px 8px;
      border-radius:999px;
    }
    .badge.hl{
      border-color:rgba(245,197,66,0.35);
      color:var(--accent);
    }

    .desc{
      margin:8px 0 0 0;
      color:var(--muted);
      font-size:14px;
      max-width:82ch;
    }

    .badges{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .empty{
      color:var(--muted);
      font-size:14px;
      padding:14px 0;
      display:none;
    }

    /* RIGHT MENU (same theme) */
    aside{
      padding-left:18px;
      border-left:2px solid var(--accent);
      height:fit-content;
      position:sticky;
      top:28px;
    }

    .menuTitle{
      margin:0 0 12px 0;
      font-size:12px;
      font-weight:600;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--fg);
      opacity:0.9;
    }

    .group{
      margin-bottom:14px;
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:6px 0;
      user-select:none;
    }

    /* Section title clickable (filters) */
    .row .mainBtn{
      font-size:14px;
      font-weight:500;
      color:var(--fg);
      background:transparent;
      border:0;
      padding:0;
      cursor:pointer;
      text-align:left;
      flex:1;
    }
    .row .mainBtn:hover{ color:var(--accent); }

    /* Separate chevron toggles expand/collapse only */
    .toggle{
      width:30px;
      height:30px;
      border:1px solid var(--line);
      background:transparent;
      border-radius:8px;
      color:var(--muted2);
      cursor:pointer;
      display:grid;
      place-items:center;
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:13px;
      line-height:1;
    }
    .toggle:hover{ border-color:rgba(245,197,66,0.35); color:var(--accent); }
    .open .toggle{ color:var(--accent); border-color:rgba(245,197,66,0.35); }

    .sub{
      margin-top:8px;
      padding-left:10px;
      display:none;
      flex-direction:column;
      gap:8px;
    }
    .open .sub{ display:flex; }

    .sub button{
      background:transparent;
      border:0;
      color:var(--muted);
      font-size:13px;
      padding:4px 0;
      cursor:pointer;
      text-align:left;
    }
    .sub button:hover{ color:var(--accent); }
    .sub button.active{ color:var(--accent); }

    .divider{
      margin:16px 0;
      border-top:1px solid var(--line);
    }

    @media (max-width:900px){
      .page{ grid-template-columns:1fr; }
      aside{
        position:static;
        border-left:none;
        padding-left:0;
        border-top:2px solid var(--accent);
        padding-top:16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- MAIN -->
    <section aria-label="Writeups">
      <a class="back" href="/" aria-label="Back to home">
        <span class="arrow">←</span>
        <span>home</span>
      </a>

      <h1 class="title">Writeups</h1>
      <div class="subtitle" id="contextLine">filter: all</div>

      <div class="toolbar">
        <div class="search">
          <input id="q" type="text" placeholder="Search by title / tags / keywords" autocomplete="off" />
        </div>
        <div class="pill">results: <strong id="count">0</strong></div>
      </div>

      <!-- tag “rotation” (optional, driven by content) -->
      <div class="tagsRow" id="tagsRow"></div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty">No matching writeups.</div>
    </section>

    <!-- RIGHT MENU: only writeups -->
    <aside aria-label="Writeups menu">
      <div class="menuTitle">Writeups</div>

      <!-- HTB -->
      <section class="group open" id="g-htb">
        <div class="row">
          <button class="mainBtn" type="button" data-platform="htb">HTB</button>
          <button class="toggle" type="button" aria-label="Toggle HTB" data-toggle="g-htb">v</button>
        </div>
        <div class="sub">
          <!-- These are topic filters inside HTB -->
          <button type="button" data-platform="htb" data-topic="web">Web</button>
          <button type="button" data-platform="htb" data-topic="ad">Active Directory</button>
          <button type="button" data-platform="htb" data-topic="network">Network</button>
          <button type="button" data-platform="htb" data-topic="privesc">PrivEsc</button>
        </div>
      </section>

      <!-- THM -->
      <section class="group" id="g-thm">
        <div class="row">
          <button class="mainBtn" type="button" data-platform="thm">THM</button>
          <button class="toggle" type="button" aria-label="Toggle THM" data-toggle="g-thm">v</button>
        </div>
        <div class="sub">
          <button type="button" data-platform="thm" data-topic="web">Web</button>
          <button type="button" data-platform="thm" data-topic="ad">Active Directory</button>
          <button type="button" data-platform="thm" data-topic="network">Network</button>
        </div>
      </section>

      <!-- Others -->
      <section class="group" id="g-other">
        <div class="row">
          <button class="mainBtn" type="button" data-platform="other">Others</button>
          <button class="toggle" type="button" aria-label="Toggle Others" data-toggle="g-other">v</button>
        </div>
        <div class="sub">
          <button type="button" data-platform="other" data-topic="research">Research</button>
          <button type="button" data-platform="other" data-topic="tools">Tools</button>
          <button type="button" data-platform="other" data-topic="exploits">Exploits</button>
        </div>
      </section>

      <div class="divider"></div>
      <div class="subtitle" style="margin:0;">click section title to filter</div>
    </aside>

  </main>

  <script>
    // ------------------------------------------
    // Data model:
    // platform: htb | thm | other
    // topics/tags: array (web/ad/network/privesc/etc)
    // ------------------------------------------
    const WRITEUPS = [
      {
        id: "codeparttwo",
        title: "CodePartTwo",
        platform: "htb",
        summary: "Source exposure → server-side execution → credential reuse → privileged backup access.",
        tags: ["web","rce","misconfiguration","privesc"],
        href: "/writeups/codeparttwo"
      },
      {
        id: "expressway",
        title: "Expressway",
        platform: "htb",
        summary: "UDP discovery → IKE aggressive mode intel → PSK crack → hostname trust abuse.",
        tags: ["network","ipsec","infoleak","privesc"],
        href: "/writeups/expressway"
      },
      {
      id: "soulmate",
      title: "Soulmate",
      platform: "htb",
      os: "Linux",
      difficulty: "Easy",            // ha így van nálad
      summary: "CrushFTP auth bypass → SSH foothold → local pivot → Erlang path → root.",
      tags: ["network","udp","ike","auth-bypass","privesc"],
      href: "/writeups/soulmate/"
}

    ];

    // State
    let platformFilter = "all";   // all | htb | thm | other
    let topicFilter = null;       // e.g. web/ad/network/privesc
    let tagFilter = null;         // tag chip selection
    let query = "";

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const qEl = document.getElementById("q");
    const contextLine = document.getElementById("contextLine");
    const tagsRow = document.getElementById("tagsRow");

    function norm(s){ return (s||"").toLowerCase(); }

    function matchesQuery(w, q){
      if(!q) return true;
      const hay = [w.title, w.summary, w.platform, ...(w.tags||[])].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function matchesPlatform(w){
      if(platformFilter === "all") return true;
      return w.platform === platformFilter;
    }

    function matchesTopic(w){
      if(!topicFilter) return true;
      return (w.tags||[]).includes(topicFilter);
    }

    function matchesTag(w){
      if(!tagFilter) return true;
      return (w.tags||[]).includes(tagFilter);
    }

    function setContext(){
      const parts = [];
      parts.push(`filter: ${platformFilter}`);
      if(topicFilter) parts.push(`topic: ${topicFilter}`);
      if(tagFilter) parts.push(`tag: ${tagFilter}`);
      contextLine.textContent = parts.join(" • ");
    }

    function renderTagsPool(){
      // Build tag chips from currently platform-filtered items (so it feels relevant)
      const pool = WRITEUPS.filter(matchesPlatform);
      const set = new Set();
      pool.forEach(w => (w.tags||[]).forEach(t => set.add(t)));

      tagsRow.innerHTML = "";
      [...set].sort().forEach(t => {
        const chip = document.createElement("div");
        chip.className = "tag" + (tagFilter === t ? " active" : "");
        chip.textContent = `#${t}`;
        chip.addEventListener("click", () => {
          tagFilter = (tagFilter === t) ? null : t;
          // if user picks a tag, we keep topicFilter as-is (you can change later if you want)
          render();
        });
        tagsRow.appendChild(chip);
      });
    }

    function render(){
      const items = WRITEUPS
        .filter(matchesPlatform)
        .filter(matchesTopic)
        .filter(matchesTag)
        .filter(w => matchesQuery(w, query));

      listEl.innerHTML = "";
      emptyEl.style.display = items.length ? "none" : "block";
      countEl.textContent = String(items.length);

      setContext();
      renderTagsPool();

      items.forEach(w => {
        const div = document.createElement("div");
        div.className = "item";

        const badgeClass = (w.platform === "htb") ? "badge hl" : "badge";
        div.innerHTML = `
          <div class="itemTitle">
            <a href="${w.href}">${w.title}</a>
            <span class="${badgeClass}">${w.platform.toUpperCase()}</span>
          </div>
          <p class="desc">${w.summary}</p>
          <div class="badges">
            ${(w.tags||[]).map(t => `<span class="badge">#${t}</span>`).join("")}
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    // Search
    qEl.addEventListener("input", () => {
      query = norm(qEl.value.trim());
      render();
    });

    // Right menu toggles (expand/collapse)
    document.querySelectorAll('button[data-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.getAttribute('data-toggle');
        const group = document.getElementById(id);
        if (group) group.classList.toggle('open');
      });
    });

    // Platform filter: clicking section title sets platform + clears topic
    document.querySelectorAll('button[data-platform]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.getAttribute('data-platform');
        const t = btn.getAttribute('data-topic');

        // clear active classes
        document.querySelectorAll('.sub button').forEach(x => x.classList.remove('active'));

        platformFilter = p || "all";
        topicFilter = t || null;

        // if clicked a sub-topic, mark it active
        if(t){
          btn.classList.add('active');
        }

        // keep tagFilter if it still exists in new pool; else drop it
        if(tagFilter){
          const pool = WRITEUPS.filter(matchesPlatform);
          const exists = pool.some(w => (w.tags||[]).includes(tagFilter));
          if(!exists) tagFilter = null;
        }

        render();
      });
    });

    // Init: default show all
    render();
  </script>
</body>
</html>
