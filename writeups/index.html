<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>b3r0 — writeups</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0a0a0a;
      --fg:#f2f2f2;
      --muted:#b7b7b7;
      --muted2:#8d8d8d;
      --line:#1a1a1a;
      --accent:#f5c542;
      --max:1120px;
      --menuW:320px;
      --radius:10px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.55;
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ color:var(--accent); }

    .page{
      max-width:var(--max);
      margin:0 auto;
      padding:34px 18px 44px;
      display:grid;
      grid-template-columns: 1fr var(--menuW);
      gap:34px;
    }

    /* back arrow (top-left) */
.back{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:"JetBrains Mono", ui-monospace, monospace;
  color:var(--muted2);
  font-size:13px;
  margin-bottom:16px;
  padding:0;            /* no box */
}

.back .arrow{
  width:auto;
  height:auto;
  border:0;            /* remove border */
  border-radius:0;     /* remove rounding */
  display:inline-block;
  color:var(--muted2);
  line-height:1;
}

/* minimal hover: underline only */
.back:hover{
  color:var(--accent);
  text-decoration:underline;
  text-underline-offset:4px;
}
.back:hover .arrow{
  color:var(--accent);
}

    }
    .back:hover{ color:var(--accent); }

    /* main content */
    .title{
      margin:0;
      font-size:22px;
      font-weight:600;
      letter-spacing:-0.01em;
    }
    .subtitle{
      margin:8px 0 0 0;
      color:var(--muted2);
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:13px;
    }

    .toolbarTop{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    /* results: plain text, no pill */
    .results{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
      color:var(--muted2);
    }
    .results strong{ color:var(--fg); font-weight:500; }

    .list{
      margin-top:18px;
      border-top:1px solid var(--line);
      padding-top:18px;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .item{
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
    }
    .item:last-child{ border-bottom:none; padding-bottom:0; }

    .itemTitle{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:baseline;
      flex-wrap:wrap;
    }
    .itemTitle a{
      font-size:16px;
      font-weight:600;
      color:var(--fg);
    }
    .itemTitle a:hover{ color:var(--accent); }

    /* platform badge: no pill, no rounded border */
    .platform{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
      color:var(--muted2);
      border:none;
      padding:0;
      letter-spacing:0.06em;
    }
    .platform.hl{ color:var(--accent); }

    .desc{
      margin:8px 0 0 0;
      color:var(--muted);
      font-size:14px;
      max-width:82ch;
    }

    /* tags: inline */
    .tags{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      color:var(--muted2);
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
    }
    .tag{
      cursor:pointer;
      user-select:none;
      color:var(--muted2);
      text-decoration:none;
    }
    .tag:hover, .tag.active{
      color:var(--accent);
      text-decoration:underline;
      text-underline-offset:4px;
    }
    .tag::before{
      content:"#";
      color:rgba(245,197,66,0.9);
      margin-right:2px;
    }

    .empty{
      color:var(--muted);
      font-size:14px;
      padding:14px 0;
      display:none;
    }

    /* RIGHT MENU */
    aside{
      padding-left:18px;
      border-left:2px solid var(--accent);
      height:fit-content;
      position:sticky;
      top:28px;
    }

    .menuTitle{
      margin:0 0 12px 0;
      font-size:12px;
      font-weight:600;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--fg);
      opacity:0.9;
    }

    /* Search moved to right */
    .searchBox{
      margin:0 0 14px 0;
    }
    .searchBox input{
      width:100%;
      padding:10px 12px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background:transparent;
      color:var(--fg);
      font-size:14px;
      outline:none;
    }
    .searchBox input:focus{
      border-color:rgba(245,197,66,0.45);
    }

    .divider{
      margin:14px 0;
      border-top:1px solid var(--line);
    }

    .group{ margin-bottom:14px; }

    /* ROW becomes the "disclosure" control */
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:6px 0;
      user-select:none;
      cursor:pointer; /* <- shows clickable */
    }

    /* subtle "expandable" hint: dotted leader + hover underline */
    .row::after{
      content:"";
      flex:0 0 42px;
      height:1px;
      opacity:0.55;
      background-image: radial-gradient(circle, var(--line) 1px, transparent 1.5px);
      background-size: 6px 1px;
      background-repeat: repeat-x;
      background-position: center;
      margin-left:10px;
    }
    .row:hover .mainBtn{
      color:var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* main clickable section title */
    .row .mainBtn{
      font-size:14px;
      font-weight:500;
      color:var(--fg);
      background:transparent;
      border:0;
      padding:0;
      cursor:pointer;
      text-align:left;
      flex:1;
      outline:none;
    }

    /* chevron hidden */
    .toggle{ display:none !important; }

    /* sub-filters */
    .sub{
      margin-top:8px;
      padding-left:10px;
      display:none;
      flex-direction:column;
      gap:8px;
    }
    .open .sub{ display:flex; }

    .sub button{
      background:transparent;
      border:0;
      color:var(--muted);
      font-size:13px;
      padding:4px 0;
      cursor:pointer;
      text-align:left;
      font-family:"JetBrains Mono", ui-monospace, monospace;
    }
    .sub button:hover{ color:var(--accent); }
    .sub button.active{
      color:var(--accent);
      text-decoration:underline;
      text-underline-offset:4px;
    }

    .hint{
      color:var(--muted2);
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:12px;
    }

    @media (max-width:900px){
      .page{ grid-template-columns:1fr; }
      aside{
        position:static;
        border-left:none;
        padding-left:0;
        border-top:2px solid var(--accent);
        padding-top:16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- MAIN -->
    <section aria-label="Writeups">
      <a class="back" href="/" aria-label="Back to home">
        <span class="arrow">←</span>
        <span>home</span>
      </a>

      <h1 class="title">Writeups</h1>
      <div class="subtitle" id="contextLine">filter: all</div>

      <div class="toolbarTop">
        <div class="results">results: <strong id="count">0</strong></div>
      </div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty">No matching writeups.</div>
    </section>

    <!-- RIGHT MENU -->
    <aside aria-label="Writeups menu">
      <div class="menuTitle">Writeups</div>

      <div class="searchBox">
        <input id="q" type="text" placeholder="Search titles / keywords" autocomplete="off" />
      </div>

      <!-- PLATFORM -->
      <section class="group open" id="g-platform">
        <div class="row" data-group-toggle="g-platform" role="button" tabindex="0" aria-expanded="true">
          <button class="mainBtn" type="button">Platform</button>
          <button class="toggle" type="button" aria-label="Toggle Platform" data-toggle="g-platform">v</button>
        </div>
        <div class="sub">
          <button type="button" data-platform="all" class="active">All</button>
          <button type="button" data-platform="htb">HTB</button>
          <button type="button" data-platform="thm">THM</button>
          <button type="button" data-platform="other">Others</button>
        </div>
      </section>

      <!-- CATEGORIES -->
      <section class="group open" id="g-cats">
        <div class="row" data-group-toggle="g-cats" role="button" tabindex="0" aria-expanded="true">
          <button class="mainBtn" type="button">Categories</button>
          <button class="toggle" type="button" aria-label="Toggle Categories" data-toggle="g-cats">v</button>
        </div>
        <div class="sub">
          <button type="button" data-topic="">All categories</button>
          <button type="button" data-topic="web">Web</button>
          <button type="button" data-topic="ad">Active Directory</button>
          <button type="button" data-topic="network">Network</button>
          <button type="button" data-topic="privesc">Privilege Escalation</button>
          <button type="button" data-topic="exploit">Exploitation</button>
          <button type="button" data-topic="forensics">Forensics</button>
        </div>
      </section>

      <div class="divider"></div>
      <div class="hint">click section header to expand/collapse</div>
    </aside>

  </main>

  <script>
    const WRITEUPS = [
      {
        id: "codeparttwo",
        title: "CodePartTwo",
        platform: "htb",
        summary: "Source exposure → server-side execution → credential reuse → privileged backup access.",
        tags: ["web","exploit","privesc"],
        href: "/writeups/codeparttwo/"
      },
      {
        id: "expressway",
        title: "Expressway",
        platform: "htb",
        summary: "UDP discovery → IKE aggressive mode intel → offline PSK testing → hostname trust abuse.",
        tags: ["network","exploit","privesc"],
        href: "/writeups/expressway/"
      },
      {
        id: "soulmate",
        title: "Soulmate",
        platform: "htb",
        summary: "CrushFTP auth bypass → SSH foothold → local pivot → internal service path → root.",
        tags: ["web","network","exploit","privesc"],
        href: "/writeups/soulmate/"
      }
    ];

    let platformFilter = "all";
    let topicFilter = "";
    let query = "";

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const qEl = document.getElementById("q");
    const contextLine = document.getElementById("contextLine");

    function norm(s){ return (s||"").toLowerCase(); }

    function matchesQuery(w, q){
      if(!q) return true;
      const hay = [w.title, w.summary, w.platform, ...(w.tags||[])].join(" ").toLowerCase();
      return hay.includes(q);
    }
    function matchesPlatform(w){
      if(platformFilter === "all") return true;
      return w.platform === platformFilter;
    }
    function matchesTopic(w){
      if(!topicFilter) return true;
      return (w.tags||[]).includes(topicFilter);
    }
    function setContext(){
      const parts = [];
      parts.push(`filter: ${platformFilter}`);
      if(topicFilter) parts.push(`category: ${topicFilter}`);
      contextLine.textContent = parts.join(" • ");
    }

    function render(){
      const items = WRITEUPS
        .filter(matchesPlatform)
        .filter(matchesTopic)
        .filter(w => matchesQuery(w, query));

      listEl.innerHTML = "";
      emptyEl.style.display = items.length ? "none" : "block";
      countEl.textContent = String(items.length);
      setContext();

      items.forEach(w => {
        const div = document.createElement("div");
        div.className = "item";

        const platformClass = (w.platform === "htb") ? "platform hl" : "platform";
        const tagsHtml = (w.tags||[])
          .map(t => `<span class="tag" data-tag="${t}" role="button" tabindex="0">${t}</span>`)
          .join("");

        div.innerHTML = `
          <div class="itemTitle">
            <a href="${w.href}">${w.title}</a>
            <span class="${platformClass}">${w.platform.toUpperCase()}</span>
          </div>
          <p class="desc">${w.summary}</p>
          <div class="tags">${tagsHtml}</div>
        `;

        div.querySelectorAll(".tag").forEach(el => {
          el.addEventListener("click", () => {
            topicFilter = el.getAttribute("data-tag") || "";
            document.querySelectorAll('.sub button[data-topic]').forEach(b => b.classList.remove("active"));
            const btn = document.querySelector(`.sub button[data-topic="${topicFilter}"]`);
            if(btn) btn.classList.add("active");
            render();
          });
          el.addEventListener("keydown", (e) => {
            if(e.key === "Enter" || e.key === " ") el.click();
          });
        });

        listEl.appendChild(div);
      });
    }

    // Search
    qEl.addEventListener("input", () => {
      query = norm(qEl.value.trim());
      render();
    });

    // Expand/Collapse by clicking the section header row
    function toggleGroup(id){
      const group = document.getElementById(id);
      if(!group) return;
      group.classList.toggle("open");
      const row = group.querySelector(".row[data-group-toggle]");
      if(row) row.setAttribute("aria-expanded", group.classList.contains("open") ? "true" : "false");
    }

    document.querySelectorAll(".row[data-group-toggle]").forEach(row => {
      const id = row.getAttribute("data-group-toggle");

      row.addEventListener("click", () => toggleGroup(id));

      row.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleGroup(id);
        }
      });

      // Prevent toggling when clicking inside the title button itself (optional)
      // In this page, the title is purely a label, so we keep it simple:
      row.querySelectorAll(".mainBtn").forEach(btn => {
        btn.addEventListener("click", (e) => e.stopPropagation());
      });
    });

    // Prevent sub-click from collapsing section
    document.querySelectorAll(".sub button").forEach(btn => {
      btn.addEventListener("click", (e) => e.stopPropagation());
    });

    // Platform selection
    document.querySelectorAll('.sub button[data-platform]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub button[data-platform]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');

        platformFilter = btn.getAttribute('data-platform') || "all";
        render();
      });
    });

    // Category selection
    document.querySelectorAll('.sub button[data-topic]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub button[data-topic]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');

        topicFilter = btn.getAttribute('data-topic') || "";
        render();
      });
    });

    render();
  </script>
</body>
</html>
